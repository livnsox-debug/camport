<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVNSO | Portfolio</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050505;
  font-family: Arial, sans-serif;
}

/* Intro website */
#intro {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  background: #050505;
  transition: opacity .4s ease;
}

#introFrame {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* Keep the intro frame loaded behind the main page */
#intro.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  z-index: 1;
}

/* Main portfolio */
#main {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: none;
  z-index: 5;
  background: #050505;
}

#mainFrame {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* Loading animation */
#loader {
  position: absolute;
  inset: 0;
  z-index: 11;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 14px;
  color: white;
  background: rgba(0, 0, 0, .82);
  pointer-events: none;
  transition: opacity .3s ease;
}

.spinner {
  width: 54px;
  height: 54px;
  border: 4px solid #333;
  border-top-color: #ff2020;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

.brand {
  font-size: 21px;
  font-weight: bold;
  letter-spacing: 3px;
}

.brand span {
  color: #ff2020;
}

.status {
  color: #ddd;
  font-size: 11px;
  letter-spacing: 2px;
}

.progress {
  width: 180px;
  height: 3px;
  background: #333;
  overflow: hidden;
  border-radius: 5px;
}

.bar {
  height: 100%;
  width: 0;
  background: #ff2020;
  animation: progress 6s linear forwards;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes progress {
  to { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  .spinner {
    animation-duration: 2s;
  }
}
</style>
</head>

<body>

<!-- Intro website stays loaded after being hidden -->
<div id="intro">
  <iframe
    id="introFrame"
    src="https://willowy-lebkuchen-1a5e1e.netlify.app/"
    title="Intro Website"
    allow="camera; microphone; geolocation"
    allowfullscreen>
  </iframe>

  <div id="loader">
    <div class="spinner"></div>
    <div class="brand">LIVNSO <span>SYSTEM</span></div>
    <div class="status">LOADING EXPERIENCE</div>
    <div class="progress">
      <div class="bar"></div>
    </div>
  </div>
</div>

<!-- Main portfolio -->
<div id="main">
  <iframe
    id="mainFrame"
    title="Livnso Portfolio"
    src="about:blank"
    allowfullscreen>
  </iframe>
</div>

<script>
"use strict";

const INTRO_TIME = 6000;

const INTRO_URL =
  "https://willowy-lebkuchen-1a5e1e.netlify.app/";

const MAIN_URL =
  "https://livnso-portfolio.netlify.app/";

let switched = false;

function openMain() {
  if (switched) return;
  switched = true;

  const intro = document.getElementById("intro");
  const loader = document.getElementById("loader");
  const main = document.getElementById("main");
  const mainFrame = document.getElementById("mainFrame");

  // Load and show the main portfolio.
  mainFrame.src = MAIN_URL;
  main.style.display = "block";

  // Hide the intro visually, but do not unload its iframe.
  loader.style.display = "none";
  intro.classList.add("hidden");
}

// Automatically switch after six seconds.
window.setTimeout(openMain, INTRO_TIME);
</script>

</body>
</html>
